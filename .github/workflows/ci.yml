# Roda os testes em todo PR e em todo push para develop/main.
# Se falhar, o PR mostra um X vermelho antes do merge.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
